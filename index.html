<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trace File List</title>
</head>
<body>
  <h1>Trace JSON 목록</h1>
  <ol id="fileList"></ol>

  <script>
    async function fetchSequenceDiagrams() {
      try {
        const response = await fetch('http://localhost:8000/api/sequence-diagrams');
        const data = await response.json();
        const files = data.files || [];
        const list = document.getElementById("fileList");
        list.innerHTML = "";
        files.forEach(file => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = `viewer.html?file=build/sequence_diagram/${file}`;
          link.textContent = file;
          li.appendChild(link);
          list.appendChild(li);
        });
      } catch (err) {
        document.getElementById("fileList").innerHTML = `<li>파일 목록을 불러올 수 없습니다.</li>`;
      }
    }
    fetchSequenceDiagrams();
  </script>
</body>
</html>
